server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true
      routes:
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-oauth2
          uri: http://localhost:8081
          predicates:
            - Path=/oauth2/**
        - id: user-service-login
          uri: http://localhost:8081
          predicates:
            - Path=/login/**
        - id: user-service-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/**, /swagger-ui/**, /swagger-ui.html
        
        - id: history-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/quantities/history/**, /api/v1/quantities/count/**

        - id: conversion-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/quantities/convert, /api/v1/quantities/compare, /api/v1/quantities/add, /api/v1/quantities/subtract, /api/v1/quantities/divide
